<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container mt-5">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Product List</h3>
          <div>
            <a th:href="@{/products/add}" class="btn btn-light">
              <i class="fas fa-plus"></i> Add New Product
            </a>
            <a th:href="@{/products/delete-all}"
               class="btn btn-danger"
               onclick="return confirm('Are you sure you want to delete ALL products?')">
              <i class="fas fa-trash"></i> Delete All
            </a>
          </div>
        </div>

        <div class="card-body">
          <!-- Success/Error Messages -->
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
            <span th:text="${warning}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <!-- Search Bar -->
          <div class="row mb-3">
            <div class="col-md-6">
              <form th:action="@{/products}" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control me-2"
                       placeholder="Search products..."
                       th:value="${keyword}">
                <input type="hidden" name="pageNo" value="1">
                <input type="hidden" name="pageSize" th:value="${pageSize}">
                <input type="hidden" name="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDirection" th:value="${sortDirection}">
                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-search"></i> Search
                </button>
              </form>
            </div>
            <div class="col-md-6 text-end">
                                <span class="badge bg-info">
                                    Total Products: <span th:text="${totalItems}">0</span>
                                </span>
            </div>
          </div>

          <!-- Products Table -->
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead class="table-dark">
              <tr>
                <th>
                  <a th:href="@{/products(pageNo=${currentPage}, pageSize=${pageSize}, sortField='id', sortDirection=${reverseSortDirection})}"
                     class="text-white text-decoration-none">
                    ID
                    <i th:if="${sortField == 'id'}"
                       th:class="${sortDirection == 'asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down'">
                    </i>
                  </a>
                </th>
                <th>
                  <a th:href="@{/products(pageNo=${currentPage}, pageSize=${pageSize}, sortField='name', sortDirection=${reverseSortDirection})}"
                     class="text-white text-decoration-none">
                    Name
                    <i th:if="${sortField == 'name'}"
                       th:class="${sortDirection == 'asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down'">
                    </i>
                  </a>
                </th>
                <th>Description</th>
                <th>
                  <a th:href="@{/products(pageNo=${currentPage}, pageSize=${pageSize}, sortField='price', sortDirection=${reverseSortDirection})}"
                     class="text-white text-decoration-none">
                    Price
                    <i th:if="${sortField == 'price'}"
                       th:class="${sortDirection == 'asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down'">
                    </i>
                  </a>
                </th>
                <th>
                  <a th:href="@{/products(pageNo=${currentPage}, pageSize=${pageSize}, sortField='quantity', sortDirection=${reverseSortDirection})}"
                     class="text-white text-decoration-none">
                    Quantity
                    <i th:if="${sortField == 'quantity'}"
                       th:class="${sortDirection == 'asc'} ? 'fas fa-sort-up' : 'fas fa-sort-down'">
                    </i>
                  </a>
                </th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Product Name</td>
                <td th:text="${#strings.abbreviate(product.description, 30)}">Description</td>
                <td th:text="${#numbers.formatDecimal(product.price, 0, 2)}">0.00</td>
                <td>
                                            <span th:if="${product.quantity < 5}" class="badge bg-danger" th:text="${product.quantity}">
                                            </span>
                  <span th:unless="${product.quantity < 5}" th:text="${product.quantity}">
                                            </span>
                </td>
                <td th:text="${product.category != null ? product.category : 'N/A'}">Category</td>
                <td>
                  <div class="btn-group btn-group-sm" role="group">
                    <a th:href="@{/products/view/{id}(id=${product.id})}"
                       class="btn btn-info" title="View">
                      <i class="fas fa-eye"></i>
                    </a>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}"
                       class="btn btn-warning" title="Edit">
                      <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}"
                       class="btn btn-danger"
                       title="Delete"
                       onclick="return confirm('Are you sure you want to delete this product?')">
                      <i class="fas fa-trash"></i>
                    </a>
                  </div>
                </td>
              </tr>
              <tr th:if="${products.isEmpty()}">
                <td colspan="7" class="text-center text-muted">No products found</td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center">
            <div>
              <span>Showing page <span th:text="${currentPage}"></span> of <span th:text="${totalPages}"></span></span>
            </div>
            <nav>
              <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled' : ''">
                  <a class="page-link"
                     th:href="@{/products(pageNo=${currentPage - 1}, pageSize=${pageSize}, sortField=${sortField}, sortDirection=${sortDirection}, keyword=${keyword})}">
                    Previous
                  </a>
                </li>
                <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                    class="page-item"
                    th:classappend="${i == currentPage} ? 'active' : ''">
                  <a class="page-link"
                     th:href="@{/products(pageNo=${i}, pageSize=${pageSize}, sortField=${sortField}, sortDirection=${sortDirection}, keyword=${keyword})}"
                     th:text="${i}">
                  </a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled' : ''">
                  <a class="page-link"
                     th:href="@{/products(pageNo=${currentPage + 1}, pageSize=${pageSize}, sortField=${sortField}, sortDirection=${sortDirection}, keyword=${keyword})}">
                    Next
                  </a>
                </li>
              </ul>
            </nav>
            <div>
              <select class="form-select form-select-sm" onchange="window.location.href=this.value">
                <option th:each="size : {5, 10, 20, 50}"
                        th:value="@{/products(pageNo=1, pageSize=${size}, sortField=${sortField}, sortDirection=${sortDirection}, keyword=${keyword})}"
                        th:selected="${size == pageSize}"
                        th:text="${size} + ' per page'">
                </option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
