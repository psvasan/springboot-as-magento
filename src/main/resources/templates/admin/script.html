<div th:fragment="script" >
    <script th:inline="javascript">
        /*<![CDATA[*/
        (function() {
            // For demonstration, we have a pre-set admin user "Alex Rivera"
            // You can simulate logout and change the displayed username.
            const userNameSpan = document.getElementById('displayUserName');
            const greetingSpan = document.getElementById('greetingUserName');
            const avatarDiv = document.getElementById('avatarInitials');
            const logoutBtn = document.getElementById('logoutButtonAdmin');

            // current admin state (simulated)
            let currentAdmin = {
                name: /*[[${username}]]*/ 'Guest',
                initials: 'AU'
            };

            function updateUserInterface() {
                if (userNameSpan) userNameSpan.innerText = currentAdmin.name;
                if (greetingSpan) greetingSpan.innerText = currentAdmin.name.split(' ')[0];
                if (avatarDiv) avatarDiv.innerText = currentAdmin.initials;
            }

            // logout action: just for demo, resets to default admin or shows login screen simulation
            // In a real app, you'd redirect to login. Here we toggle to "Guest" mode as fallback.
            function performLogout() {

                if(confirm("⚠️ You will be redirected to login page. Continue?")) {
                    // mimic logged-out state: change user info to "Guest" (but keep admin-style)
                    currentAdmin = { name: 'Guest User', initials: 'GU' };
                    updateUserInterface();
                    window.location.href = '/process-logout?type=admin';
                }
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    performLogout();
                });
            }

            // sidebar active state change (just for illustration)
            const navLinks = document.querySelectorAll('.sidebar-nav a');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    // remove active class from all li parent
                    document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
                    const parentLi = link.closest('li');
                    if(parentLi) parentLi.classList.add('active');
                    // update main content header text (just for demo)
                    const headerTitle = document.querySelector('.content-header h1');
                    const linkText = link.innerText.trim();
                    if(headerTitle && linkText) {
                        headerTitle.innerText = linkText;
                        const descParagraph = document.querySelector('.content-header p');
                        if(descParagraph) descParagraph.innerHTML = `Viewing ${linkText} section — admin module.`;
                        setTimeout(() => {
                            if(headerTitle && descParagraph) {
                                headerTitle.innerText = "Admin Dashboard";
                                descParagraph.innerHTML = `Welcome back, <span id="greetingUserName">${currentAdmin.name.split(' ')[0]}</span> — manage your platform from here.`;
                            }
                        }, 1800);
                    }
                    e.preventDefault();
                });
            });

            updateUserInterface();

            // additional style to ensure sidebar brown background persists
            console.log("Admin page ready — brown sidebar (20% width), header with logo left & user right, main layout 90% container.");
        })();
        /*]]>*/
    </script>
</div>
